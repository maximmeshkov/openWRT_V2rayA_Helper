name: Build and test

on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev libjson-c-dev nftables iproute2
          cc -std=gnu11 -Wall -Wextra -Werror -O2 src/*.c -lcurl -ljson-c -o /tmp/v2raya-helper-test
          V2RAYA_HELPER=/tmp/v2raya-helper-test python3 -m unittest discover -s tests -v
          sudo python3 tests/netns_probe.py /tmp/v2raya-helper-test

  package:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        release: ['23.05.5', '24.10.8']
        # 64-bit LE ARM, 32-bit LE MIPS, 32-bit BE MIPS, x86-64
        target: [mediatek/filogic, ramips/mt7621, ath79/generic, x86/64]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # libcurl and json-c headers build the host-side test fixtures.
          sudo apt-get install -y build-essential clang flex bison gawk gettext libncurses-dev \
            libssl-dev libelf-dev python3-distutils rsync unzip zlib1g-dev file zstd swig qemu-user \
            libcurl4-openssl-dev libjson-c-dev
      - name: Build OpenWrt ${{ matrix.release }} packages for ${{ matrix.target }}
        working-directory: ${{ runner.temp }}
        run: bash "$GITHUB_WORKSPACE/.github/sdk-package.sh" '${{ matrix.release }}' '${{ matrix.target }}' "$GITHUB_WORKSPACE/packages"
      - name: Name the artifact
        id: artifact
        run: echo "name=openwrt-${{ matrix.release }}-$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: packages/
          if-no-files-found: error
